<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border-collapse: collapse;
        width: 700px;
        text-align: center;
      }

      th {
        border: 1px solid black;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <table border="1">
      <thead>
        <tr>
          <th rowspan="4">N</th>
          <th colspan="11">A</th>
        </tr>
        <tr>
          <th colspan="6">B</th>
          <th rowspan="3" colspan="2">G</th>
          <th colspan="3">K</th>
        </tr>
        <tr>
          <th colspan="2" rowspan="2">C</th>
          <th rowspan="2">D</th>
          <th colspan="2">E</th>
          <th rowspan="2">F</th>
          <th colspan="2">H</th>
          <th rowspan="2">J</th>
        </tr>
        <tr>
          <th>L</th>
          <th>S</th>
          <th>N</th>
          <th>M</th>
        </tr>
      </thead>
    </table>
  </body>
</html>
