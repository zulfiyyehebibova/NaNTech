<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Gallery Viewer</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="gallery-container">
    <!-- Əsas şəkildə nümayiş sahəsi -->
    <div class="gallery-preview">
      <button class="nav-btn prev-btn" id="prevBtn">❮</button>
      <img class="preview-image" id="mainImg" src="https://d32qys9a6wm9no.cloudfront.net/images/tvs/backdrop/80/7bd0327ae883ad4030efe217faebcafa_1280x720.jpg?t=1640007601" alt="Preview"/>
      <button class="nav-btn next-btn" id="nextBtn">❯</button>
    </div>

    <!-- Kiçik şəkillər -->
    <div class="gallery-thumbnails">
      <img class="thumbnail active" src="https://d32qys9a6wm9no.cloudfront.net/images/tvs/backdrop/80/7bd0327ae883ad4030efe217faebcafa_1280x720.jpg?t=1640007601" alt="Regular Show"/>
      <img class="thumbnail" src="https://media.wired.com/photos/5932661626780e6c04d2b642/master/pass/AdventureTime.jpg" alt="Adventure Time"/>
      <img class="thumbnail" src="https://www.advanced-television.com/wp-content/uploads/2025/06/Gumball-New-e1751274946386-1024x620.png" alt="Gumball"/>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
