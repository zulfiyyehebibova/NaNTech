<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Kalkulyator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <h2>Kalkulyator</h2>
    
    <div class="input-group">
      <input type="number" id="Bir" placeholder="Birinci ədəd">
      <input type="number" id="Iki" placeholder="İkinci ədəd">
    </div>

    <div class="buttons">
      <button class="btn" data-op="+">+</button>
      <button class="btn" data-op="-">-</button>
      <button class="btn" data-op="*">×</button>
      <button class="btn" data-op="/">÷</button>
    </div>

    <div class="result-container">
        <span>Nəticə:</span>
        <h2 class="result">0</h2>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
