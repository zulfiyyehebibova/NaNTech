<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <style>
        table{
            border-collapse: collapse;
            text-align: center;
            width: 700px;
        }

        th{
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>

    <table>
        <thead>

            <tr>
                <th rowspan="3">A</th>
                <th colspan="3" rowspan="2">B</th>
                <th rowspan="3">C</th>
                <th colspan="5">D</th>
            </tr>

            <tr>
                <th colspan="2">O</th>
                <th colspan="2">P</th>
                <th rowspan="2">N</th>
            </tr>

            <tr>
                <th>E</th>
                <th>F</th>
                <th>G</th>

                <th>H</th>
                <th>K</th>

                <th>L</th>
                <th>M</th>
            </tr>

        </thead>
    </table>

</body>
</html>
