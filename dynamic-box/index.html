<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Box</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <div class="inputs">
      <input type="text" class="bg" placeholder="Background color" />
      <input type="number" class="width" placeholder="Width (px)" />
      <input type="number" class="height" placeholder="Height (px)" />
      <input type="text" class="border-color" placeholder="Border color" />
    </div>

    <div class="box"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
