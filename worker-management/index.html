<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <div class="overlay"></div>

    <div class="main-container">
        <div class="top-bar">
            <div class="entries">
                Show 
                <select id="entrySelect">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select> entries
            </div>
            
            <div class="actions">
                <button class="btn-add add"><i class="fa-solid fa-plus"></i> Add Worker</button>
                <div class="search-wrapper">
                    <input class="search-input" type="text" placeholder="Search workers...">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table id="workerTable">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Position</th>
                        <th>Office</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Zulfiyye</td>
                        <td>Hebibova</td>
                        <td>Front-end Developer</td>
                        <td>London</td>
                        <td>177700</td>
                        <td>
                            <i class="fa-solid fa-pen btn-edit"></i>
                            <i class="fa-solid fa-trash btn-delete"></i>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

   
    <div class="modal-box create-modal">
        <i class="fa-solid fa-xmark close-icon"></i>
        <h3>Add New Worker</h3>
        <input type="text" class="first" placeholder="First name">
        <input type="text" class="last" placeholder="Last name">
        <input type="text" class="position" placeholder="Position">
        <input type="text" class="office" placeholder="Office">
        <input type="number" class="salary" placeholder="Salary">
        <button class="btn-main create">Create</button>
    </div>

    <div class="modal-box edit-modal">
        <i class="fa-solid fa-xmark close-icon"></i>
        <h3>Edit Information</h3>
        <input type="text" class="ad" placeholder="First name">
        <input type="text" class="soyad" placeholder="Last name">
        <input type="text" class="movqe" placeholder="Position">
        <input type="text" class="ofis" placeholder="Office">
        <input type="number" class="maas" placeholder="Salary">
        <button class="btn-main start">Update</button>
    </div>

    <div class="modal-box delete-modal">
        <i class="fa-solid fa-circle-exclamation" style="font-size: 40px; color: #e74c3c;"></i>
        <h3>Are you sure?</h3>
        <p>This row will be permanently deleted.</p>
        <div class="confirm-btns">
            <button class="btn-confirm beli">Yes, Delete</button>
            <button class="btn-cancel xeyr">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
